<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps - Directions From My Location</title>
    <style>
        /* Always set the map height explicitly to define the size of the div */
        #map {
            height: 100vh;
            width: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background-color: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        input,
        button {
            padding: 8px;
            margin-right: 5px;
        }
    </style>
</head>

<body>

    <div id="controls">
        <input id="destination" type="text" placeholder="Enter destination (e.g., Paris, France)">
        <button onclick="calculateRoute()">Get Directions</button>
    </div>

    <!-- The DOM element that will contain the map -->
    <div id="map"></div>

    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let userLocation = null;

        function initMap() {
            // Initialize the directions services
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();

            // Default center point (fallback if geolocation fails)
            const fallbackLocation = { lat: 0, lng: 0 };

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 14,
                center: fallbackLocation,
            });

            // Bind the directions renderer to our map object
            directionsRenderer.setMap(map);

            // Attempt to get user's current location via browser Geolocation API
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };

                        // Center the map on the user's location initially
                        map.setCenter(userLocation);

                        // Place a marker on user's current spot
                        new google.maps.Marker({
                            position: userLocation,
                            map: map,
                            title: "Your Current Location"
                        });
                    },
                    () => {
                        handleLocationError(true);
                    }
                );
            } else {
                // Browser doesn't support Geolocation
                handleLocationError(false);
            }
        }

        function calculateRoute() {
            const destinationInput = document.getElementById("destination").value;

            if (!userLocation) {
                alert("Could not detect your current location. Please check your browser permissions.");
                return;
            }
            if (!destinationInput) {
                alert("Please enter a destination.");
                return;
            }

            const request = {
                origin: userLocation, // Uses the captured lat/lng coordinates
                destination: destinationInput, // Can be a string address or lat/lng object
                travelMode: google.maps.TravelMode.DRIVING // Options: DRIVING, WALKING, BICYCLING, TRANSIT
            };

            // Pass request to the service to calculate the path
            directionsService.route(request, (result, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    // Render the line path on the map
                    directionsRenderer.setDirections(result);
                } else {
                    alert("Directions request failed due to: " + status);
                }
            });
        }

        function handleLocationError(browserHasGeolocation) {
            alert(
                browserHasGeolocation
                    ? "Error: The Geolocation service failed. Please allow location access."
                    : "Error: Your browser doesn't support geolocation."
            );
        }
    </script>

    <!-- Load the Google Maps JavaScript API. Replace 'YOUR_API_KEY' with your actual key -->
    <script src="https://googleapis.com" async defer></script>
</body>

</html>
